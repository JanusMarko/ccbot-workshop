[project]
name = "ccweb"
version = "0.1.0"
description = "React web gateway to Claude Code sessions via tmux"
readme = { text = "React web gateway to Claude Code sessions via tmux. See docs/ for full documentation.", content-type = "text/plain" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "libtmux>=0.37.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ccweb = "ccweb.backend.main:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccweb"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
